[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "awesome-sysml"
version = "0.1.0"
description = "A curated list of SysML v2 language tools, implementations, samples, and resources"
readme = "README.md"
license = {text = "CC0-1.0"}
authors = [
    {name = "Jon Fox", email = "jfox@mycr0ft.com"}
]
keywords = ["sysml", "sysml-v2", "mbse", "systems-engineering", "awesome-list"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Documentation",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
]
